name: Check Novora Bot

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run project check
        run: npm run check

      - name: Run state and preset tests
        run: npm test

      - name: Verify JavaScript syntax
        run: find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
