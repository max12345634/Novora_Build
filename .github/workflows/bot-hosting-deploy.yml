name: Optional BotHosting Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  notify-bot-hosting:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger BotHosting webhook when configured
        env:
          BOT_HOSTING_WEBHOOK_URL: ${{ secrets.BOT_HOSTING_WEBHOOK_URL }}
        run: |
          if [ -z "$BOT_HOSTING_WEBHOOK_URL" ]; then
            echo "BOT_HOSTING_WEBHOOK_URL is not configured yet. Skipping deploy trigger."
            exit 0
          fi

          curl -X POST "$BOT_HOSTING_WEBHOOK_URL"
